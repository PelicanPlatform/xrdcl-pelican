name: Test

on:
  workflow_dispatch:
    branches:
      - main
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  BUILD_TYPE: Debug

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        external-gtest: [ YES ]
        os: [ ubuntu-24.04 ]
        # Build against the latest upstream release of each series, resolved
        # when the job runs, so a header change in a new XRootD release fails
        # here rather than in a downstream package build.
        xrootd:
          - series: '6.0.x'
            tag-pattern: '^v6\.0\.[0-9]+$'
          - series: '6.x.y'
            tag-pattern: '^v6\.[0-9]+\.[0-9]+$'

    runs-on: ${{ matrix.os }}
    name: Build with external_gtest=${{ matrix.external-gtest }} on ${{ matrix.os }} against XRootD ${{ matrix.xrootd.series }}

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Resolve XRootD release
      id: xrootd
      env:
        TAG_PATTERN: ${{ matrix.xrootd.tag-pattern }}
      run: |
        tag=$(git ls-remote --tags --refs https://github.com/xrootd/xrootd.git 'v6.*' \
          | awk '{print $2}' | sed 's|^refs/tags/||' | grep -E "$TAG_PATTERN" | sort -V | tail -n 1)
        if [ -z "$tag" ]; then
          echo "No XRootD release tag matches $TAG_PATTERN"
          exit 1
        fi
        echo "Building against XRootD $tag"
        echo "tag=$tag" >> $GITHUB_OUTPUT

    - name: Generate cache key
      id: cache_key
      working-directory: ${{runner.workspace}}
      run: |
        git clone --depth 1 --branch ${{ steps.xrootd.outputs.tag }} https://github.com/xrootd/xrootd.git
        cd xrootd
        echo "git:$(git rev-parse HEAD)" > key
        echo "os:$(uname -svmo)" >> key
        echo "week:$(date '+%Y-%U')" >> key
        cat key
        echo "key=xrootd-asan-$(sha256sum key | cut -f 1 -d ' ')" >> $GITHUB_OUTPUT

        # Disable auto-update of the manpages during apt installs; saves a few seconds.
        sudo rm -f /var/lib/man-db/auto-update

    - name: Try download from cache
      uses: actions/cache/restore@v4
      id: cache
      with:
        path: ${{ runner.workspace }}/xrootd/build/release_dir
        key: ${{ steps.cache_key.outputs.key }}

    # Only need the go build environment if there was a cache miss
    - uses: actions/setup-go@v5
      if: steps.cache.outputs.cache-hit != 'true'

    - name: Install XRootD
      working-directory: ${{runner.workspace}}
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        # Build deps
        sudo apt update && sudo apt-get install -y cmake libz-dev uuid-dev libcurl4-openssl-dev libcurl4 pkg-config libssl-dev g++ libscitokens-dev libgtest-dev nlohmann-json3-dev libtinyxml2-dev

        # Build our preferred set of patches on xrootd
        rm -rf xrootd
        git clone --depth 1 --branch ${{ steps.xrootd.outputs.tag }} https://github.com/xrootd/xrootd.git
        cd xrootd
        mkdir -p build/release_dir
        cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=$PWD/release_dir -DENABLE_ASAN=TRUE
        make -j $(($(nproc) + 2)) install

        # Install the load tester
        go install github.com/bbockelm/go-wrk@92dbe19
        cp ~/go/bin/go-wrk release_dir/bin/

    - name: Upload XRootD to cache
      uses: actions/cache/save@v4
      if: steps.cache.outputs.cache-hit != 'true'
      id: cache-save
      with:
        path: ${{ runner.workspace }}/xrootd/build/release_dir
        key: ${{ steps.cache_key.outputs.key }}

    - name: Install build deps
      if: steps.cache.outputs.cache-hit == 'true'
      run: |
        sudo apt update && sudo apt-get install -y cmake libcurl4-openssl-dev libcurl4 pkg-config libssl-dev g++ libscitokens-dev libgtest-dev nlohmann-json3-dev libtinyxml2-dev

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: CMAKE_PREFIX_PATH=$PWD/../xrootd/build/release_dir/lib/cmake/XRootD cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_ASAN=true -DENABLE_TESTS=true -DXROOTD_PLUGINS_EXTERNAL_GTEST=true -DXROOTD_EXTERNAL_TINYXML2=true -DXROOTD_EXTERNAL_JSON=true

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build . --config $BUILD_TYPE --parallel $(($(nproc) + 2))

    - name: Unit Tests
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: |
        ctest -j6 -C $BUILD_TYPE --timeout 60 --verbose
